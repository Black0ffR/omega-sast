name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Run demo scan
      run: |
        # sample-bundle.js is intentionally vulnerable, so a findings
        # exit code (2/3/4/5) is expected. Only code 1 is a scanner error.
        # NOTE: `||` (not `;`) keeps this alive under bash -e.
        node bin/omega.js test/fixtures/sample-bundle.js --security --report --out /tmp/omega-ci || code=$?
        code=${code:-0}
        if [ "$code" -eq 1 ]; then echo "scanner errored"; exit 1; fi
        test -f /tmp/omega-ci/report.json
        test -f /tmp/omega-ci/report.html
        test -f /tmp/omega-ci/report.md

    - name: Verify exit codes
      run: |
        # Should exit 2 (critical findings) by default
        node bin/omega.js test/fixtures/sample-bundle.js --security --quiet --out /tmp/omega-exit1 || true
        # Should exit 0 with OMEGA_FAIL_ON=none
        OMEGA_FAIL_ON=none node bin/omega.js test/fixtures/sample-bundle.js --security --quiet --out /tmp/omega-exit2
